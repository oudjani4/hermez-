<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermez Tasks</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='11813680' data-sdk='show_11813680'></script>
<style>
  body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
  button { display: block; width: 100%; margin: 10px 0; padding: 16px; font-size: 16px; border: none; border-radius: 10px; background: #ffb800; color: #111; font-weight: bold; }
  button:disabled { background: #555; color: #aaa; }
  #status { margin-top: 20px; color: #ffb800; }
</style>
</head>
<body>
<h2>🎬 مهام مشاهدة الإعلانات</h2>
<button onclick="watchAd('monetag_view_1')">شاهد إعلان 1 (+5)</button>
<button onclick="watchAd('monetag_view_2')">شاهد إعلان 2 (+5)</button>
<button onclick="watchAd('monetag_view_3')">شاهد إعلان 3 (+5)</button>
<button onclick="watchAd('monetag_view_4')">شاهد إعلان 4 (+5)</button>
<div id="status"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function watchAd(code) {
  document.getElementById('status').innerText = 'جاري تحميل الإعلان...';
  show_11813680().then(() => {
    document.getElementById('status').innerText = 'تم! جاري تسجيل المكافأة...';
    tg.sendData(JSON.stringify({ action: 'complete_task', code: code }));
  }).catch((e) => {
    document.getElementById('status').innerText = 'لم تكتمل مشاهدة الإعلان.';
  });
}
</script>
</body>
</html>

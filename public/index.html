<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hermez Coin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root {
    --bg: #0e0b08;
    --bg-panel: #17120c;
    --gold: #e7c565;
    --gold-bright: #f6df9a;
    --gold-dim: #8a723f;
    --text-dim: #9a8f7a;
    --border: #2a2115;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: #f0e9d8;
    font-family: 'Georgia', 'Times New Roman', serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    background:
      radial-gradient(circle at 50% 15%, rgba(231,197,101,0.07), transparent 60%),
      var(--bg);
  }
  .screen { display: none; min-height: 100vh; padding: 28px 22px 20px; }
  .screen.active { display: block; }
  .screen-centered.active {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 22px;
    min-height: calc(100vh - 78px - env(safe-area-inset-bottom, 0px));
    padding-bottom: 0;
  }
  .screen-centered .brand,
  .screen-centered .balance-block,
  .screen-centered .coin-wrap,
  .screen-centered .mine-btn,
  .screen-centered .mine-status {
    width: 100%;
    max-width: 320px;
  }

  /* ---- MINE ---- */
  .brand { text-align: center; margin-top: 0; }
  .brand h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 6px;
    font-weight: 700;
    color: var(--gold-bright);
    text-shadow: 0 0 18px rgba(231,197,101,0.25);
  }
  .brand .sub {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--gold-dim);
  }
  .brand .rule {
    width: 90px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    margin: 14px auto 0;
  }

  .balance-block { text-align: center; margin-top: 0; }
  .balance-block .amount {
    font-size: 44px;
    font-weight: 700;
    color: var(--gold-bright);
    letter-spacing: 1px;
  }
  .balance-block .label {
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-dim);
  }

  .coin-wrap { display: flex; justify-content: center; margin: 0; }
  .coin { width: 190px; height: 190px; object-fit: contain; filter: drop-shadow(0 10px 24px rgba(231,197,101,0.25)); }

  .mine-btn {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #241a08;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    box-shadow: 0 6px 20px rgba(231,197,101,0.25);
    cursor: pointer;
  }
  .mine-btn:disabled {
    background: #3a3226;
    color: #8a8270;
    box-shadow: none;
  }
  .mine-status {
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* ---- Generic panel screens ---- */
  .panel-title {
    font-size: 20px;
    color: var(--gold-bright);
    letter-spacing: 2px;
    margin: 4px 0 18px;
    text-align: center;
  }
  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .card .row-title { font-size: 15px; color: #f0e9d8; }
  .card .row-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .card .reward { color: var(--gold); font-weight: 700; }

  .task-btn, .action-btn {
    font-family: inherit;
    border: 1px solid var(--gold-dim);
    background: transparent;
    color: var(--gold-bright);
    padding: 9px 16px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .task-btn:disabled {
    color: var(--text-dim);
    border-color: var(--border);
  }
  .card-flex {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .ref-link-box {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .ref-link-box input {
    flex: 1;
    background: #0b0906;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 10px 12px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 12px;
  }

  .profile-avatar {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    margin: 0 auto 12px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    color: #241a08;
  }
  .profile-name { text-align: center; font-size: 17px; color: #f0e9d8; }
  .profile-id { text-align: center; font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  /* ---- Bottom Nav ---- */
  nav.bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    background: #100c08;
    border-top: 1px solid var(--border);
    padding: 10px 4px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  nav.bottom-nav button {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    padding: 4px 0;
  }
  nav.bottom-nav button svg { width: 22px; height: 22px; }
  nav.bottom-nav button.active { color: var(--gold-bright); }
  nav.bottom-nav button.active svg { filter: drop-shadow(0 0 4px rgba(231,197,101,0.5)); }
</style>
</head>
